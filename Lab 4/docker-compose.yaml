version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: flask_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: app_db
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app_network

  web:
    build: .
    container_name: flask_web
    restart: always
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: "postgresql://user:password@db:5432/app_db"
    depends_on:
      - db
    networks:
      - app_network

volumes:
  db_data:
    name: flask_db_data

networks:
  app_network:
    name: flask_app_network